<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App 2 - Country Explorer | Sara Sultan Alharthi</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .app-container {
      max-width: 750px;
      margin: 0 auto;
      padding: 50px 40px 60px;
    }

    .app-title {
      font-size: 32px;
      font-weight: 800;
      color: #111;
      margin-bottom: 8px;
    }

    .app-subtitle {
      color: #6b7280;
      font-size: 15px;
      margin-bottom: 32px;
    }

    .search-row {
      display: flex;
      gap: 12px;
      margin-bottom: 28px;
    }

    .search-row input {
      flex: 1;
      padding: 14px 18px;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      font-family: inherit;
      transition: border-color 0.3s;
    }

    .search-row input:focus {
      border-color: #f9a8d4;
    }

    .search-btn {
      padding: 14px 26px;
      background: #111827;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.3s;
    }

    .search-btn:hover {
      background: #1f2937;
    }

    #countryResult {
      margin-top: 10px;
    }

    .country-card {
      background: white;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      display: flex;
      align-items: flex-start;
      gap: 24px;
    }

    .country-card img {
      width: 140px;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      flex-shrink: 0;
    }

    .country-card h2 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #111;
    }

    .country-card p {
      font-size: 15px;
      color: #374151;
      margin-bottom: 6px;
    }

    .country-card p strong {
      color: #111;
    }

    .error-msg {
      background: #fff5f5;
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 16px 20px;
      color: #dc2626;
      font-size: 15px;
    }

    .loading-msg {
      color: #6b7280;
      font-size: 15px;
      padding: 10px 0;
    }
  </style>
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header>
    <div class="logo">
      <span class="code-icon">&lt;/&gt;</span>
      <div>

    <nav>

      <a href="labs.html">Labs</a>
      <a href="myworks.html" class="active">My Works</a>

  <main>
    <div class="app-container">
      <h1 class="app-title">Country Explorer</h1>
      <p class="app-subtitle">Search for any country and view information using a public API.</p>

      <div class="search-row">
        <input type="text" id="countryInput" placeholder="Enter country name...">
        <button id="searchBtn" class="search-btn">Search</button>
      </div>

      <div id="countryResult"></div>
    </div>
  </main>

  <!-- ===== FOOTER ===== -->

        </svg>
      </a>
      <a href="https://www.linkedin.com/in/sara-alharthi-86094b367?utm_source=share_via&utm_content=profile&utm_medium=member_ios" target="_blank" class="footer-icon" aria-label="LinkedIn">

  <script>
    const countryInput = document.getElementById("countryInput");
    const searchBtn = document.getElementById("searchBtn");
    const countryResult = document.getElementById("countryResult");

    function searchCountry() {
      const countryName = countryInput.value.trim();
      if (countryName === "") {
        countryResult.innerHTML = '<p class="error-msg">Please enter a country name.</p>';
        return;
      }

      countryResult.innerHTML = '<p class="loading-msg">Loading...</p>';

      fetch("https://restcountries.com/v3.1/name/" + countryName)
        .then(function (response) {
          if (!response.ok) throw new Error("Country not found");
          return response.json();
        })
        .then(function (data) {
          const country = data[0];
          countryResult.innerHTML = `
            <div class="country-card">
              <img src="${country.flags.png}" alt="Flag of ${country.name.common}">
              <div>
                <h2>${country.name.common}</h2>
                <p><strong>Capital:</strong> ${country.capital ? country.capital[0] : "N/A"}</p>
                <p><strong>Region:</strong> ${country.region}</p>
                <p><strong>Population:</strong> ${country.population.toLocaleString()}</p>
                <p><strong>Languages:</strong> ${Object.values(country.languages || {}).join(", ") || "N/A"}</p>
              </div>
            </div>
          `;
        })
        .catch(function () {
          countryResult.innerHTML = '<p class="error-msg">No country found. Try another name.</p>';
        });
    }

    searchBtn.addEventListener("click", searchCountry);

    countryInput.addEventListener("keypress", function (e) {
      if (e.key === "Enter") searchCountry();
    });
  </script>

</body>
</html>
